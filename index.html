<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VibeArcade - 游戏大厅</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { touch-action: manipulation; }
        body {
            font-family: -apple-system, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px;
        }
        h1 {
            font-size: 52px; margin-bottom: 8px;
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4, #ffe66d);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            text-align: center;
        }
        .subtitle { color: #aaa; margin-bottom: 44px; font-size: 16px; text-align: center; }
        .games { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; max-width: 640px; }
        .game-card {
            width: 280px; padding: 28px 24px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            cursor: pointer; text-decoration: none; color: #fff;
            transition: all .3s ease;
            display: flex; flex-direction: column; gap: 10px; align-items: flex-start;
        }
        .game-card:hover {
            transform: translateY(-6px);
            background: rgba(255,255,255,0.15);
            box-shadow: 0 10px 40px rgba(78,205,196,0.3);
        }
        .game-card .emoji { font-size: 46px; }
        .game-card .title { font-size: 22px; font-weight: 700; }
        .game-card .desc { font-size: 13px; color: #bbb; line-height: 1.6; }
        .game-card .play { margin-top: 8px; font-size: 14px; font-weight: 600; color: #4ecdc4; }
        footer { margin-top: 44px; font-size: 12px; color: #888; letter-spacing: 1px; text-align: center; }
        @media (max-width: 600px) {
            h1 { font-size: 36px; }
            .games { flex-direction: column; }
            .game-card { width: 100%; max-width: 340px; }
        }
    </style>
</head>
<body>
    <h1>VibeArcade</h1>
    <p class="subtitle">选择一个游戏开始吧</p>
    <div class="games">
        <a class="game-card" href="games/triangle/index.html">
            <div class="emoji">🔺</div>
            <div class="title">点连三角形</div>
            <div class="desc">2~4 人连线策略游戏，连接点形成三角形，得分最高者获胜。</div>
            <div class="play">开始游戏 →</div>
        </a>
        <a class="game-card" href="games/bumper-arena/index.html">
            <div class="emoji">💥</div>
            <div class="title">弹弹乐 Bumper Arena</div>
            <div class="desc">拖拽弹射对战，竞技场不断缩小，先把对手撞出界者得分。</div>
            <div class="play">开始游戏 →</div>
        </a>
    </div>
    <footer>Made with ♥ by Lulu & Syuhoo — VibeArcade</footer>
</body>
</html>
